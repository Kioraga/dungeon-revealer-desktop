name: Release build

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package app
        run: npx --yes electron-packager@15.5.1 . --platform=${{ matrix.platform }} --arch=x64 --out=release --overwrite --ignore="^/(\.git|\.github)$"
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-revealer-desktop-${{ matrix.platform }}-x64
          path: release/*
          if-no-files-found: error