appId: io.github.dungeon-revealer.desktop
productName: Dungeon Revealer Desktop
directories:
  output: release
files:
  - build/**
  - server-build/**
  - electron/**
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
npmRebuild: false
linux:
  target: AppImage
  category: Game
  icon: build/images/icons/android-chrome-512x512.png
  artifactName: DungeonRevealer_Linux.${ext}
win:
  target: msi
  icon: build/images/icons/icon.ico
  artifactName: DungeonRevealer_Windows.${ext}